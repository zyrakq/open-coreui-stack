x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"
    compress: "${LOG_COMPRESS:-true}"

services:
  open-coreui:
    image: ${COMPLEX_IMAGE:-localhost/open-coreui}
    volumes:
      - open-coreui:/app/data
    logging: *default-logging
    environment:
      PORT: ${PORT:-8168}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///app/data/database.sqlite3}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    networks:
      - open-coreui-network

volumes:
  open-coreui:
    name: open-coreui

networks:
  open-coreui-network:
    name: open-coreui-network
